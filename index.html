<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tester</title>
  </head>
  <body>
    <button>Run Script</button>
    <p class="output"></p>

    <br /><br />

    <label for="input">Input</label><br />
    <textarea id="input" rows="15" cols="64">
let animal = 'dog'

let noise = null

if (animal == 'cow') {
  noise = 'moo'
}

if (animal == 'dog') {
  noise = 'woof'
}

const noiseCount = 3

let output = 'The ' . animal . ' says "'

let number = 0

while (number < noiseCount) {
  let endCharacter = null

  if (number != (noiseCount - 1)) {
    endCharacter = ' '
  } else {
    endCharacter = '!'
  }

  output .= noise . endCharacter

  number += 1
  _x += number
}

output .= '"'
    </textarea>

    <script type="module">
      import { TYPES } from './src/constants.mjs'
      import Parser from './src/handlers/parser.mjs'

      const button = document.querySelector('button')
      const input = document.querySelector('#input')
      const output = document.querySelector('.output')

      button.addEventListener('click', () => {
        const contents = input.value

        const startTime = performance.now()

        const parser = new Parser({
          variables: {
            _x: {
              isConst: false,
              type: TYPES.number,
              value: 0,
              onChange: newValue => {
                // console.log('New _x value', newValue)
              },
            },
          },
          functions: {
            pow: {
              args: [
                {
                  name: 'num',
                  types: [TYPES.number],
                  defaultValue: null,
                },
                {
                  name: 'power',
                  types: [TYPES.number],
                  defaultValue: null,
                },
              ],
              getResult: (num, power) => {
                return Math.pow(num, power)
              },
            },
          },
        })

        console.clear()

        parser.parseText(contents)

        const perfTime = performance.now() - startTime

        output.innerText = `Execution time: ${perfTime}ms`

        parser.dumpVars()
      })
    </script>
  </body>
</html>
